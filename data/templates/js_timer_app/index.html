<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="timer">
  <h1>__TITLE__</h1>
  <div class="display" id="display" role="timer" aria-live="off">00:00.0</div>
  <div class="ring">
    <svg viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
      <circle class="track" cx="60" cy="60" r="52"></circle>
      <circle class="bar" id="bar" cx="60" cy="60" r="52"></circle>
    </svg>
  </div>
  <div class="row">
    <button id="start" type="button" class="primary">Start</button>
    <button id="pause" type="button">Pause</button>
    <button id="lap" type="button">Lap</button>
    <button id="reset" type="button">Reset</button>
  </div>
  <label class="field">
    Countdown (seconds)
    <input id="countdown" type="number" min="0" max="9999" value="__COUNTDOWN_S__">
  </label>
  <button id="startCountdown" type="button">Start countdown</button>
  <ul id="laps" class="laps"></ul>
</main>
<script src="timer.js"></script>
</body>
</html>
