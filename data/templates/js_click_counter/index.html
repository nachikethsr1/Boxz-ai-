<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <h1>__TITLE__</h1>
  <output id="count" aria-live="polite">__START_VALUE__</output>
  <p id="message" class="message">__CLICK_MESSAGE__</p>

    <button id="dec" type="button" aria-label="Decrease">&minus;</button>
    <button id="inc" type="button" class="primary">__BUTTON_LABEL__</button>
    <button id="reset" type="button">Reset</button>
  </div>
</main>
<script src="counter.js"></script>
</body>
</html>
