<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Boxz — from-scratch language model</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #141822;
    --panel-2: #1b2130;
    --line: #262c3b;
    --text: #e7ecf5;
    --muted: #8b93a7;
    --accent: #6ea8fe;
    --accent-2: #7ee0b8;
    --danger: #ff8a8a;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(1200px 600px at 20% -10%, #17203a 0%, var(--bg) 55%);
    color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 20px 60px; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -0.02em; }
  .badge {
    font: 12px/1 var(--mono); padding: 6px 9px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); background: var(--panel);
  }
  .badge.live { color: var(--accent-2); border-color: #24614c; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: linear-gradient(180deg, var(--panel), #12161f);
    border: 1px solid var(--line); border-radius: 16px;
  }
  .chat { display: flex; flex-direction: column; height: 620px; overflow: hidden; }
  .log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 92%; white-space: pre-wrap; word-wrap: break-word; }
  .msg .who { font: 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .msg .body { padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); }
  .user { align-self: flex-end; }
  .user .body { background: #1d2a44; border-color: #2b3d63; }
  .boxz .body { background: var(--panel-2); }
  .boxz .body code, .boxz .body pre { font-family: var(--mono); font-size: 13px; }
  .boxz .body pre { background: #0f131b; border: 1px solid var(--line); padding: 10px; border-radius: 8px; overflow-x: auto; }
  .sys { align-self: center; max-width: 100%; color: var(--muted); font-size: 13px; }
  .meta { font: 11px/1.4 var(--mono); color: var(--muted); margin-top: 6px; }
  form { display: flex; gap: 10px; padding: 14px; border-top: 1px solid var(--line); background: #10141c; }
  textarea {
    flex: 1; resize: none; min-height: 46px; max-height: 150px; padding: 12px;
    border-radius: 10px; border: 1px solid var(--line); background: #0d1118; color: var(--text);
    font: inherit;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  button {
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    padding: 10px 16px; border-radius: 10px; font: 600 14px/1 inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: #24406e; border-color: #33589a; }
  .side { display: flex; flex-direction: column; gap: 18px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0; padding: 14px 16px 0; }
  .card .content { padding: 12px 16px 16px; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; }
  dt { color: var(--muted); font-size: 13px; }
  dd { margin: 0; font-family: var(--mono); font-size: 13px; text-align: right; word-break: break-all; }
  label.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0; font-size: 13px; }
  input[type=range] { width: 140px; accent-color: var(--accent); }
  .val { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 42px; text-align: right; }
  .spark { height: 74px; display: flex; align-items: flex-end; gap: 2px; }
  .spark div { flex: 1; background: linear-gradient(180deg, var(--accent), #2b4b86); border-radius: 2px 2px 0 0; min-height: 2px; }
  .err { color: var(--danger); font-size: 13px; padding: 0 16px 12px; }
  .hint { color: var(--muted); font-size: 12px; }
  .typing { display: inline-block; width: 8px; height: 15px; background: var(--accent); animation: blink 1s steps(2) infinite; vertical-align: -2px; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Boxz</h1>
    <span class="badge" id="model-badge">loading…</span>
    <span class="badge" id="backend-badge">backend: ?</span>
    <span class="badge live" id="live-badge">live inference</span>
  </header>

  <div class="grid">
    <section class="card chat">
      <div class="log" id="log">
        <div class="msg sys">Every reply on this page is generated by the trained Boxz checkpoint on this machine. No external API is involved.</div>
      </div>
      <form id="form">
        <textarea id="input" placeholder="Ask Boxz something…  (Enter to send, Shift+Enter for a new line)" rows="2"></textarea>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <button class="primary" id="send" type="submit">Send</button>
          <button id="reset" type="button">Reset</button>
        </div>
      </form>
      <div class="err" id="err"></div>
    </section>

    <aside class="side">
      <section class="card">
        <h2>Model</h2>
        <div class="content"><dl id="model-info"></dl></div>
      </section>
      <section class="card">
        <h2>Generation</h2>
        <div class="content">
          <label class="row">temperature <input type="range" id="temperature" min="0" max="1.5" step="0.05" value="0.8"><span class="val" id="temperature-v">0.80</span></label>
          <label class="row">top-k <input type="range" id="top_k" min="0" max="100" step="1" value="40"><span class="val" id="top_k-v">40</span></label>
          <label class="row">top-p <input type="range" id="top_p" min="0.1" max="1" step="0.01" value="0.95"><span class="val" id="top_p-v">0.95</span></label>
          <label class="row">max tokens <input type="range" id="max_new_tokens" min="16" max="400" step="8" value="160"><span class="val" id="max_new_tokens-v">160</span></label>
          <label class="row">repetition <input type="range" id="repetition_penalty" min="1" max="1.6" step="0.02" value="1"><span class="val" id="repetition_penalty-v">1.00</span></label>
        </div>
      </section>
      <section class="card">
        <h2>Training loss</h2>
        <div class="content">
          <div class="spark" id="spark"></div>
          <div class="hint" id="train-hint">reading training log…</div>
        </div>
      </section>
    </aside>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const state = { busy: false };

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function addMessage(role, text, meta) {
  const wrap = el('div', 'msg ' + (role === 'user' ? 'user' : 'boxz'));
  wrap.appendChild(el('div', 'who', role === 'user' ? 'you' : 'boxz'));
  const body = el('div', 'body', text);
  // render fenced code blocks as <pre>
  if (text.includes('```') || /\n {4}|^\s{1,4}(def|function|const|let|class)/.test(text)) {
    body.textContent = '';
    const parts = text.split(/```/);
    parts.forEach((part, i) => {
      if (i % 2 === 1) {
        const pre = document.createElement('pre');
        pre.textContent = part.replace(/^[a-zA-Z]+\n/, '');
        body.appendChild(pre);
      } else if (part) {
        body.appendChild(document.createTextNode(part));
      }
    });
  }
  wrap.appendChild(body);
  if (meta) wrap.appendChild(el('div', 'meta', meta));
  $('log').appendChild(wrap);
  $('log').scrollTop = $('log').scrollHeight;
  return wrap;
}

async function loadStatus() {
  try {
    const s = await (await fetch('/api/status')).json();
    const m = s.model;
    $('model-badge').textContent = `${(m.parameters/1e6).toFixed(2)}M params · ${m.layers} layers · ctx ${m.context_length}`;
    $('backend-badge').textContent = `backend: ${s.backend.name} ${s.backend.version}`;
    const dl = $('model-info');
    dl.innerHTML = '';
    const rows = [
      ['checkpoint', s.checkpoint.split('/').slice(-2).join('/')],
      ['stage', s.train_state.stage || 'pretrain'],
      ['step', s.train_state.step ?? '—'],
      ['best val loss', s.train_state.best_val_loss ? Number(s.train_state.best_val_loss).toFixed(3) : '—'],
      ['d_model / heads', `${m.d_model} / ${m.heads}`],
      ['vocab', m.vocab_size],
      ['norm / act', `${m.norm} / ${m.activation}`],
    ];
    for (const [k, v] of rows) {
      dl.appendChild(el('dt', null, k));
      dl.appendChild(el('dd', null, String(v)));
    }
  } catch (e) {
    $('model-badge').textContent = 'status unavailable';
  }
}

async function loadMetrics() {
  try {
    const m = await (await fetch('/api/metrics')).json();
    if (!m.available) { $('train-hint').textContent = 'no training log found'; return; }
    const rows = m.rows.filter(r => r.train_loss !== undefined).slice(-60);
    const vals = rows.map(r => r.train_loss);
    const spark = $('spark');
    spark.innerHTML = '';
    if (!vals.length) { $('train-hint').textContent = 'log has no loss entries yet'; return; }
    const max = Math.max(...vals), min = Math.min(...vals);
    for (const v of vals) {
      const bar = document.createElement('div');
      const h = max === min ? 50 : 8 + 92 * (v - min) / (max - min);
      bar.style.height = h + '%';
      bar.style.opacity = (0.45 + 0.55 * (1 - (v - min) / (max - min || 1))).toFixed(2);
      bar.title = `loss ${v}`;
      spark.appendChild(bar);
    }
    const last = vals[vals.length - 1];
    const first = vals[0];
    $('train-hint').textContent = `loss ${first.toFixed(3)} → ${last.toFixed(3)} over ${m.rows.length} logged steps`;
  } catch (e) {
    $('train-hint').textContent = 'could not read training log';
  }
}

async function send(message) {
  if (state.busy || !message.trim()) return;
  state.busy = true;
  $('err').textContent = '';
  $('send').disabled = true;
  addMessage('user', message.trim());
  $('input').value = '';
  const pending = addMessage('boxz', '');
  pending.querySelector('.body').appendChild(el('span', 'typing'));
  try {
    const payload = {
      message: message.trim(),
      max_new_tokens: Number($('max_new_tokens').value),
      temperature: Number($('temperature').value),
      top_k: Number($('top_k').value),
      top_p: Number($('top_p').value),
      repetition_penalty: Number($('repetition_penalty').value),
    };
    const body = pending.querySelector('.body');
    const q = new URLSearchParams({
      message: payload.message,
      max_new_tokens: String(payload.max_new_tokens),
      temperature: String(payload.temperature),
      top_k: String(payload.top_k),
      top_p: String(payload.top_p),
      repetition_penalty: String(payload.repetition_penalty),
    });
    // Stream server-sent events so the first words appear immediately.  Every
    // chunk is the cumulative reply, so we simply replace the text each time.
    const t0 = performance.now();
    let tokens = 0;
    let text = '';
    await new Promise((resolve, reject) => {
      const src = new EventSource('/api/stream?' + q.toString());
      src.onmessage = (ev) => {
        if (ev.data === '[DONE]') { src.close(); resolve(); return; }
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.error) { src.close(); reject(new Error(msg.error)); return; }
        tokens++;
        text = msg.text;
        body.textContent = text;
        $('log').scrollTop = $('log').scrollHeight;
      };
      src.onerror = () => { src.close(); resolve(); };
    });
    const wall = ((performance.now() - t0) / 1000).toFixed(2);
    pending.remove();
    if (!text.trim()) {
      $('err').textContent = 'the model produced an empty reply';
    } else {
      const tps = (tokens / Math.max(0.001, Number(wall))).toFixed(1);
      addMessage('boxz', text, `${tokens} chunks · ${tps} chunk/s · ${wall}s wall`);
    }
  } catch (e) {
    pending.remove();
    $('err').textContent = 'request failed: ' + e;
  } finally {
    state.busy = false;
    $('send').disabled = false;
    $('input').focus();
  }
}

// -- wiring ------------------------------------------------------------
$('form').addEventListener('submit', (e) => { e.preventDefault(); send($('input').value); });
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send($('input').value); }
});
$('reset').addEventListener('click', async () => {
  await fetch('/api/reset', { method: 'POST' });
  $('log').innerHTML = '<div class="msg sys">Conversation cleared.</div>';
});
for (const id of ['temperature', 'top_k', 'top_p', 'max_new_tokens', 'repetition_penalty']) {
  const input = $(id), out = $(id + '-v');
  const fmt = () => {
    const v = Number(input.value);
    out.textContent = (id === 'top_k' || id === 'max_new_tokens') ? String(v) : v.toFixed(2);
  };
  input.addEventListener('input', fmt); fmt();
}
loadStatus(); loadMetrics();
setInterval(loadMetrics, 20000);
</script>
</body>
</html>
