[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boxz"
version = "0.3.0"
description = "Boxz — a from-scratch NumPy transformer language model with its own autograd, tokenizer and training pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Boxz project" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
boxz = "boxz.cli:main"

[tool.setuptools.packages.find]
include = ["boxz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests that train a model (deselect with -m 'not slow')",
]
