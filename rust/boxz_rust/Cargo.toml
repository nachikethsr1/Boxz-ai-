[package]
name = "boxz_rust"
version = "0.1.0"
edition = "2021"
description = "Optional Rust kernels for the Boxz numerical engine"
license = "MIT"

[lib]
name = "boxz_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
numpy = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
